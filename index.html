<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Filigrane</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Filigrane</h1>
    <p class="intro">Your files stay in this browser. Images and PDF pages are rasterized, watermarked, and exported as a flat A4 PDF.</p>
    <form id="watermark-form">
      <label class="drop-zone" for="files">
        <input id="files" type="file" accept="image/*,application/pdf" multiple required>
        <span><strong>Choose images or PDFs</strong><br>or drop them here</span>
      </label>
      <p id="file-list" class="hint">No files selected</p>
      <label for="text">Watermark text</label>
      <input id="text" type="text" maxlength="250" placeholder="e.g. For rental application only" required>
      <button id="submit" type="submit">Create flat PDF</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <p class="project-link"><a href="https://github.com/loorisr/filigrane" aria-label="View the project on GitHub" title="View the project on GitHub"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0a8 8 0 0 0-2.53 15.59c.4.07.55-.17.55-.38v-1.49c-2.01.44-2.43-.85-2.43-.85-.33-.84-.81-1.06-.81-1.06-.66-.45.05-.44.05-.44.73.05 1.12.75 1.12.75.65 1.11 1.7.79 2.11.6.07-.47.25-.79.46-.97-1.6-.18-3.28-.8-3.28-3.56 0-.79.28-1.43.75-1.93-.08-.18-.33-.92.07-1.92 0 0 .61-.2 2 .74A6.9 6.9 0 0 1 8 4.87c.61 0 1.22.08 1.79.24 1.39-.94 2-.74 2-.74.4 1 .15 1.74.07 1.92.47.5.75 1.14.75 1.93 0 2.77-1.69 3.37-3.3 3.55.26.22.49.65.49 1.31v1.94c0 .21.14.46.55.38A8 8 0 0 0 8 0Z"/></svg></a></p>
  </main>
  <script src="vendor/pdf.min.js"></script>
  <script src="vendor/jspdf.umd.min.js"></script>
  <script src="vendor/jsqr.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
